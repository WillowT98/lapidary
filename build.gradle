plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()

	maven {
		name = "QuiltMC"
		url = uri("https://maven.quiltmc.org/repository/release")
	}

	maven {
		name = "Ladysnake"
		url = uri("https://maven.ladysnake.org/releases")
	}

	maven {
		name = "Shedaniel"
		url = uri("https://maven.shedaniel.me/")
	}

	maven {
		name = "BlameJared"
		url = uri("https://maven.blamejared.com")
		content {
			includeGroup("vazkii.patchouli")
		}
	}

	maven {
		name = "JitPack"
		url = uri("https://jitpack.io")
	}

	/*
	 * LambDynamicLights, SpruceUI, and PrideLib.
	 */
	exclusiveContent {
		forRepository {
			maven {
				name = "Gegy"
				url = uri("https://maven.gegy.dev")
			}
		}

		filter {
			/*
			 * Matches both:
			 * dev.lambdaurora
			 * dev.lambdaurora.lambdynamiclights
			 */
			includeGroupByRegex("dev\\.lambdaurora(\\..*)?")

			// PrideLib
			includeGroup("io.github.queerbric")
		}
	}

	/*
	 * Trinkets is temporarily retrieved through Modrinth
	 * because the TerraformersMC Maven is returning 502 errors.
	 */
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = uri("https://api.modrinth.com/maven")
			}
		}

		filter {
			includeGroup("maven.modrinth")
		}
	}
}


loom {
	splitEnvironmentSourceSets()

	mods {
		"lapidary" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

def lambDynamicLightsVersion = "4.8.10+1.21.1"

dependencies {
	// Minecraft and mappings
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()

	// Fabric Loader
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Required: entity scaling support
	modApi("com.github.Virtuoel:Pehkui:${project.pehkui_version}") {
		exclude group: "net.fabricmc.fabric-api"
	}

	/*
 * Some development dependency requests Mod Menu through the unavailable
 * TerraformersMC Maven. Mod Menu is optional, so remove that transitive
 * dependency from every configuration.
 */
	configurations.configureEach {
		exclude group: "com.terraformersmc", module: "modmenu"
	}

	// Compile against the dedicated LambDynamicLights API.
// Disable transitives because Lapidary only needs the API classes here.
	modCompileOnly(
			"dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:${lambDynamicLightsVersion}"
	) {
		transitive = false
	}

// Load the complete official LambDynamicLights release in the dev client.
// Exact Modrinth coordinates for 4.8.10+1.21.1.
	modLocalRuntime(
			"dev.lambdaurora.lambdynamiclights:lambdynamiclights-runtime:${lambDynamicLightsVersion}"
	)

	// Required: in-game guidebook system
	modImplementation "vazkii.patchouli:Patchouli:${project.patchouli_version}-FABRIC"
	// Required: wearable jewelry and accessory slots
	modImplementation(
			"maven.modrinth:trinkets:${project.trinkets_version}"
	)

	/*
 * Trinkets 3.10.0 bundles these at runtime, but the Modrinth
 * Maven endpoint does not expose them as transitive compile
 * dependencies. Add them explicitly for code that directly
 * accesses TrinketComponent and TrinketInventory.
 */
	modCompileOnly(
			"org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
	)

	modCompileOnly(
			"org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
	)

	// Load Origins in the development environment for compatibility testing.
	// Carpet is an optional Origins integration that Lapidary does not need.
	modRuntimeOnly("io.github.apace100:origins-fabric:${project.origins_version}") {
		exclude group: "carpet", module: "fabric-carpet"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Add publishing repositories here if Lapidary is later
		// published through Maven.
	}
}